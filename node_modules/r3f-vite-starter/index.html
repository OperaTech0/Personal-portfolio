<!DOCTYPE html>
<html lang="en">
  <head>
    <!-- Basic Setup -->
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="google-site-verification" content="I0ZEirpvzkUA7Tk1HRG7fq8Q7EyoJeMXDeMzP78GNSo" />

    <!-- SEO Title -->
    <title>
      OperaTech Portfolio
    </title>

    <!-- SEO Meta -->
    <meta
      name="description"
      content="OperaTech builds modern websites, AI-powered applications, responsive UI/UX designs, business platforms, and digital solutions that help brands grow online."
    />

    <meta
      name="keywords"
      content="OperaTech, web development, AI solutions, frontend developer, responsive websites, UI UX design, software engineer, React developer, Nigeria tech company, modern websites, SEO services, app development"
    />

    <meta name="author" content="OperaTech" />
    <meta name="robots" content="index, follow" />

    <!-- Canonical -->
    <link rel="canonical" href="https://yourdomain.com/" />

    <!-- Favicon -->
    <link
      rel="icon"
      type="image/png"
      href="/Images/operatech-logo.png"
    />

    <!-- Open Graph SEO -->
    <meta property="og:type" content="website" />
    <meta
      property="og:title"
      content="OperaTech Portfolio"
    />
    <meta
      property="og:description"
      content="We create fast, modern, SEO-optimized websites and AI-powered digital solutions."
    />
    <meta
      property="og:image"
      content="https://yourdomain.com/Images/preview.jpg"
    />
    <meta property="og:url" content="https://yourdomain.com/" />
    <meta property="og:site_name" content="OperaTech" />

    <!-- Twitter SEO -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta
      name="twitter:title"
      content="OperaTech | Web & AI Solutions"
    />
    <meta
      name="twitter:description"
      content="Modern websites, AI apps, responsive UI/UX and digital solutions for businesses."
    />
    <meta
      name="twitter:image"
      content="https://yourdomain.com/Images/operatech-logo.png"
    />

    <!-- Theme Color -->
    <meta name="theme-color" content="#000000" />

    <!-- Performance Optimization -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      rel="preconnect"
      href="https://fonts.gstatic.com"
      crossorigin
    />

    <link rel="dns-prefetch" href="https://cdnjs.cloudflare.com" />

    <!-- Prefetch Important Files -->
    <link rel="prefetch" href="/src/main.jsx" />

    <!-- Structured Data -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Organization",
        "name": "OperaTech",
        "url": "https://yourdomain.com",
        "logo": "https://yourdomain.com/Images/operatech-logo.png",
        "sameAs": [
          "https://instagram.com/opera_tech0",
         "https://www.tiktok.com/@opera_tech",
        "https://x.com/OperaTech0",
        "https://www.pinterest.com/Opera_Tech/"
        
          
        ],
        "description": "OperaTech provides modern web development, AI solutions, responsive websites and digital services."
      }
    </script>
  </head>

  <body>
    <div id="root"></div>

    <!-- Main React/Vite Entry -->
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
